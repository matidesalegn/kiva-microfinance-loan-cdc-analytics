kiva:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | as_number }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'kiva_admin') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'kiva_password') }}"
      secure: False
