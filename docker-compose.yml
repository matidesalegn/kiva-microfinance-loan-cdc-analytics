services:
  # ----------------------------------------------------
  # 1. OLTP Database: PostgreSQL (Source)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kiva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiva_password}
      POSTGRES_DB: ${POSTGRES_DB:-kiva_oltp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Command ensures logical replication is enabled for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiva_admin} -d ${POSTGRES_DB:-kiva_oltp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # 2. Event Stream: Redpanda (Lightweight Kafka Alternative)
  # ----------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: kiva_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092"
      - --pandaproxy-addr
      - "0.0.0.0:8082"
      - --advertise-pandaproxy-addr
      - "localhost:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # 3. Change Data Capture: Debezium Connector
  # ----------------------------------------------------
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: kiva_debezium
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      # Ensuring JSON structure is clean for ClickHouse
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # 3b. CDC Connector Auto-Registration (one-shot init job)
  # ----------------------------------------------------
  # Renders config/debezium_postgres_source.json.template with the live .env
  # credentials and POSTs it to Kafka Connect. This is what makes `docker compose
  # up -d` alone sufficient to bring the pipeline to a working state — no manual
  # curl step required.
  connector-registrar:
    image: alpine:3.20
    container_name: kiva_connector_registrar
    environment:
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: kiva-postgres-connector
      POSTGRES_USER: ${POSTGRES_USER:-kiva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiva_password}
      POSTGRES_DB: ${POSTGRES_DB:-kiva_oltp}
    volumes:
      - ./config/debezium_postgres_source.json.template:/config/debezium_postgres_source.json.template:ro
      - ./scripts/register_connector.sh:/register_connector.sh:ro
    entrypoint: ["sh", "/register_connector.sh"]
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------
  # 4. OLAP Data Warehouse: ClickHouse
  # ----------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: kiva_clickhouse
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # Native TCP port
      - "9363:9363" # Prometheus metrics port
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kiva_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kiva_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./config/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/clickhouse_prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------
  # 5. Transformation: dbt
  # ----------------------------------------------------
  dbt:
    image: python:3.11-slim
    container_name: kiva_dbt
    # Install dbt-clickhouse on boot (Python 3.11 avoids the mashumaro bug entirely)
    # NOTE: the version specifier is quoted below -- unquoted, `>` is parsed by
    # sh as output redirection, silently writing pip's stdout to a file
    # literally named `=1.7.0` in the bind-mounted /usr/app (dbt_project/).
    command: ["sh", "-c", "pip install 'dbt-clickhouse>=1.7.0' mashumaro==3.13.1 && sleep infinity"]
    volumes:
      - ./dbt_project:/usr/app
      - ./dbt_project/profiles.yml:/root/.dbt/profiles.yml
    ports:
      - "8081:8081"
    working_dir: /usr/app
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # 6. Orchestration: Dagster
  # ----------------------------------------------------
  dagster:
    image: python:3.11-slim
    container_name: kiva_dagster
    command: >
      sh -c "pip install -r src/requirements.txt && 
      dagster dev -h 0.0.0.0 -p 3000 -f dagster_orchestration/definitions.py"
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      connector-registrar:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # 6b. CDC Reconciliation & Lag Monitor
  # ----------------------------------------------------
  # Custom exporter that continuously cross-checks Postgres vs ClickHouse row
  # counts and measures end-to-end CDC freshness lag, exposing both (plus
  # Debezium connector task health) as Prometheus metrics on :9200/metrics.
  cdc-monitor:
    image: python:3.11-slim
    container_name: kiva_cdc_monitor
    command: >
      sh -c "pip install --no-cache-dir -r requirements-cdc-monitor.txt &&
      python cdc_monitor.py"
    working_dir: /app
    volumes:
      - ./src:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kiva_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-kiva_password}
      DB_NAME: ${POSTGRES_DB:-kiva_oltp}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kiva_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kiva_password}
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: kiva-postgres-connector
      POLL_INTERVAL_SECONDS: "15"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 6c. Observability: PostgreSQL Exporter
  # ----------------------------------------------------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: kiva_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-kiva_admin}:${POSTGRES_PASSWORD:-kiva_password}@postgres:5432/${POSTGRES_DB:-kiva_oltp}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------
  # 7. Observability: Prometheus
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: kiva_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 7b. Grafana Plugin Installer (one-shot init job)
  # ----------------------------------------------------
  # Grafana >=11.5's own plugin installer (triggered by either the legacy
  # GF_INSTALL_PLUGINS or the newer GF_PLUGINS_PREINSTALL env var) always
  # merges your requested plugin into Grafana's built-in default app-plugin
  # list (grafana-metricsdrilldown-app, elasticsearch, grafana-lokiexplore-app,
  # grafana-pyroscope-app, grafana-exploretraces-app) -- there is no env var
  # that installs *only* what you ask for. The only true kill switch,
  # GF_PLUGINS_PREINSTALL_DISABLED=true, disables that whole subsystem
  # including your own requested plugin, with no partial opt-out (verified
  # empirically against grafana/grafana-oss:latest, not assumed from docs).
  # So the ClickHouse plugin is installed here instead, directly into the
  # shared grafana_data volume via `grafana cli plugins install` -- a
  # separate, simpler code path that bypasses the default-list merge
  # entirely -- and the main `grafana` service below disables the
  # preinstall subsystem outright, since by the time it boots the one
  # plugin it actually needs is already on disk.
  grafana-plugin-installer:
    image: grafana/grafana-oss:latest
    container_name: kiva_grafana_plugin_installer
    entrypoint: ["grafana"]
    command: ["cli", "--pluginsDir", "/var/lib/grafana/plugins", "plugins", "install", "vertamedia-clickhouse-datasource"]
    volumes:
      - grafana_data:/var/lib/grafana
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 7c. Observability: Mailpit (local SMTP catcher for testing Grafana alert emails)
  # ----------------------------------------------------
  # Grafana never sends email itself -- it's only an SMTP client, and always
  # needs a real relay to hand messages to. Mailpit acts as that relay for
  # local development: it accepts any SMTP submission on :1025 with no auth
  # and no further delivery, and shows captured messages in a web UI on
  # :8025. This lets us prove the full alert pipeline (rule fires ->
  # notification policy -> contact point -> SMTP send) works end-to-end
  # without needing real mailbox credentials. Swapping in a real relay (e.g.
  # Gmail SMTP with an App Password) later is just changing the GF_SMTP_*
  # env vars below to point at it instead.
  mailpit:
    image: axllent/mailpit:latest
    container_name: kiva_mailpit
    ports:
      - "8025:8025" # Web UI: view captured emails
      - "1025:1025" # SMTP submission port Grafana connects to
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------
  # 8. Observability: Grafana
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: kiva_grafana
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflicting with Dagster
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-kiva}
      # The ClickHouse plugin is preinstalled by grafana-plugin-installer
      # above. This disables Grafana's own default-app-plugin auto-install
      # (see the note on that service) -- this project only uses Prometheus
      # + ClickHouse, so those defaults are pure memory/disk overhead, each
      # running as its own backend subprocess.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      # Avoid background HTTP calls to grafana.com for update checks -- not
      # useful for a local/offline demo stack, and one less thing running.
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # SMTP relay for alert notification emails -- see the mailpit service
      # above. No auth needed: Mailpit accepts any local submission.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailpit:1025
      - GF_SMTP_FROM_ADDRESS=alerts@kiva.local
      - GF_SMTP_FROM_NAME=Kiva Microfinance Data Platform
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      grafana-plugin-installer:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 256M was sized for dashboards-only, pre-alerting. Unified
          # alerting (ngalert scheduler/state manager for the 4 provisioned
          # rules) plus the bleve search indices it builds for
          # dashboards/folders/rules add a permanently higher baseline --
          # 256M was getting OOM-killed (exit 137, confirmed via `docker
          # inspect --format '{{.State.OOMKilled}}'`) roughly 10-15 minutes
          # after startup, once alert evaluation and index building kicked
          # in. Even with only the one needed plugin loaded (see
          # grafana-plugin-installer above), real usage climbed to ~80% of
          # 512M within a few minutes of dashboard/API/alert activity before
          # visibly decelerating -- too close to the ceiling to trust across
          # a longer session, so this is set to 768M for real headroom.
          # docker stats/docker inspect --format '{{.State.OOMKilled}}' are
          # the way to re-diagnose this if it ever recurs; the host machine
          # has ample spare capacity (~2GB used of 5.7GB Docker VM memory
          # across the whole 13-container stack at the time this was tuned).
          memory: 768M

  # ----------------------------------------------------
  # 9. Observability: Redpanda Console
  # ----------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: kiva_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 10. Observability: Debezium UI
  # ----------------------------------------------------
  debezium-ui:
    image: quay.io/debezium/debezium-ui:2.5
    container_name: kiva_debezium_ui
    ports:
      - "8084:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    depends_on:
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # 11. Documentation: dbt Docs (lineage graph + catalog)
  # ----------------------------------------------------
  # Generates and serves the dbt-native documentation site (DAG lineage graph,
  # column-level descriptions, test coverage) so readers can browse the data
  # model interactively instead of only reading static schema docs.
  dbt-docs:
    image: python:3.11-slim
    container_name: kiva_dbt_docs
    # Version specifier quoted -- see note on the `dbt` service above.
    command: >
      sh -c "pip install --no-cache-dir 'dbt-clickhouse>=1.7.0' mashumaro==3.13.1 &&
      (dbt docs generate --project-dir /usr/app --profiles-dir /usr/app || echo 'dbt docs generate failed, serving last known state') &&
      python -m http.server 8085 --directory /usr/app/target"
    volumes:
      - ./dbt_project:/usr/app
    working_dir: /usr/app
    ports:
      - "8085:8085"
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pg_data:
  ch_data:
  redpanda_data:
  grafana_data:
