services:
  # ====================================================
  # TIER 1: OLTP DATA SOURCE & INGESTION
  # ====================================================

  # --- postgres: Primary transactional database with logical replication enabled for CDC ---
  postgres:
    image: postgres:16-alpine
    container_name: kiva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiva_password}
      POSTGRES_DB: ${POSTGRES_DB:-kiva_oltp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Command ensures logical replication is enabled for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiva_admin} -d ${POSTGRES_DB:-kiva_oltp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # --- postgres-exporter: PostgreSQL Prometheus metrics exporter for DB connection & WAL telemetry ---
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: kiva_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-kiva_admin}:${POSTGRES_PASSWORD:-kiva_password}@postgres:5432/${POSTGRES_DB:-kiva_oltp}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # =======================================================
  # TIER 2: REAL-TIME STREAMING & CHANGE DATA CAPTURE (CDC)
  # =======================================================

  # --- redpanda: Lightweight Kafka-compatible event streaming platform ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: kiva_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092"
      - --pandaproxy-addr
      - "0.0.0.0:8082"
      - --advertise-pandaproxy-addr
      - "localhost:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # --- debezium: Kafka Connect worker streaming PostgreSQL logical replication WAL changes ---
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: kiva_debezium
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Ensuring JSON structure is clean for ClickHouse
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Enable the Jolokia JMX-over-HTTP agent (bundled in the Debezium image)
      # so the Debezium UI Metrics panel can reach http://debezium:8778/jolokia.
      # The entrypoint checks ENABLE_JOLOKIA (not ENABLE_JMX_AGENT) to attach
      # the jolokia-jvm-*.jar as a javaagent on port 8778.
      ENABLE_JOLOKIA: "true"
    ports:
      - "8083:8083"
      - "8778:8778"   # Jolokia HTTP/JMX bridge for Debezium UI Metrics panel
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    deploy:
      resources:
        limits:
          # Raised from 512M: Kafka Connect JVM baseline (~350-450M) + Jolokia. 512M, causing OOM kills before port 8083 ever binds.
          memory: 1G

  # --- connector-registrar: One-shot init job auto-registering Debezium connector on startup ---
  # Renders config/debezium_postgres_source.json.template with the live .env credentials and POSTs it to Kafka Connect. 
  # This is what makes `docker compose up -d` alone sufficient to bring the pipeline to a working state — no manual
  # curl step required.
  connector-registrar:
    image: alpine:3.20
    container_name: kiva_connector_registrar
    environment:
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: kiva-postgres-connector
      POSTGRES_USER: ${POSTGRES_USER:-kiva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiva_password}
      POSTGRES_DB: ${POSTGRES_DB:-kiva_oltp}
    volumes:
      - ./config/debezium_postgres_source.json.template:/config/debezium_postgres_source.json.template:ro
      - ./scripts/register_connector.sh:/register_connector.sh:ro
    entrypoint: ["sh", "/register_connector.sh"]
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ====================================================
  # TIER 3: ANALYTICAL STORAGE (OLAP DATA WAREHOUSE)
  # ====================================================

  # --- clickhouse: Fast columnar analytical database consuming Kafka streams into ReplacingMergeTree ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: kiva_clickhouse
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # Native TCP port
      - "9363:9363" # Prometheus metrics port
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kiva_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kiva_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./config/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/clickhouse_prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ======================================================
  # TIER 4: TRANSFORMATION, DATA MODELING & ORCHESTRATION
  # ======================================================

  # --- dagster: Data orchestrator scheduling API ingestion and dbt model materializations ---
  dagster:
    image: python:3.11-slim
    container_name: kiva_dagster
    environment:
      # Shared instance home so the immediate startup run below, the schedule
      # start-up below, and the dagster dev daemon/webserver all see the same
      # run/schedule state (container-local only, nothing written to the host).
      DAGSTER_HOME: /tmp/dagster_home
    # NOTE: `pip install && mkdir` must be fully finished (blocking) before the
    # trailing `&` background launch, so it's terminated with `;`, not `&&` --
    # `&&` immediately followed by a later `&` backgrounds the *whole* preceding
    # chain (pip install included), letting `dagster dev` race ahead of the
    # install and fail with "dagster: not found". The `;` starts a fresh
    # statement so only the parenthesized subshell gets backgrounded.
    command: >
      sh -c "pip install -r src/requirements.txt && mkdir -p $$DAGSTER_HOME;
      (sleep 5;
      dagster job execute -f dagster_orchestration/definitions.py -j end_to_end_pipeline || true;
      dagster schedule start end_to_end_pipeline_schedule -f dagster_orchestration/definitions.py || true) &
      dagster dev -h 0.0.0.0 -p 3000 -f dagster_orchestration/definitions.py"
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      connector-registrar:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Raised from 512M: dagster dev (webserver + daemon) + multiprocess
          # executor workers + pip install all run concurrently and easily
          # exceed 512M, causing OOM kills (container exits with OOMKilled=true).
          memory: 1500M

  # --- dbt: Transformation environment running dbt-clickhouse models and tests ---
  dbt:
    image: python:3.11-slim
    container_name: kiva_dbt
    # Install dbt-clickhouse on boot (Python 3.11 avoids the mashumaro bug entirely)
    # NOTE: the version specifier is quoted below -- unquoted, `>` is parsed by
    # sh as output redirection, silently writing pip's stdout to a file
    # literally named `=1.7.0` in the bind-mounted /usr/app (dbt_project/).
    command: ["sh", "-c", "pip install 'dbt-clickhouse>=1.7.0' mashumaro==3.13.1 && sleep infinity"]
    volumes:
      - ./dbt_project:/usr/app
      - ./dbt_project/profiles.yml:/root/.dbt/profiles.yml
    ports:
      - "8081:8081"
    working_dir: /usr/app
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # --- dbt-docs: Static documentation server rendering the interactive dbt DAG lineage graph ---
  # Generates and serves the dbt-native documentation site (DAG lineage graph,
  # column-level descriptions, test coverage) so readers can browse the data
  # model interactively instead of only reading static schema docs.
  dbt-docs:
    image: python:3.11-slim
    container_name: kiva_dbt_docs
    # Version specifier quoted -- see note on the `dbt` service above.
    command: >
      sh -c "pip install --no-cache-dir 'dbt-clickhouse>=1.7.0' mashumaro==3.13.1 &&
      (dbt docs generate --project-dir /usr/app --profiles-dir /usr/app || echo 'dbt docs generate failed, serving last known state') &&
      python -m http.server 8085 --directory /usr/app/target"
    volumes:
      - ./dbt_project:/usr/app
    working_dir: /usr/app
    ports:
      - "8085:8085"
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================================
  # TIER 5: END-TO-END OBSERVABILITY, DATA QUALITY & ALERTING
  # ==========================================================

  # --- cdc-monitor: Custom Python service reconciling row counts and measuring end-to-end CDC lag ---
  # Custom exporter that continuously cross-checks Postgres vs ClickHouse row
  # counts and measures end-to-end CDC freshness lag, exposing both (plus
  # Debezium connector task health) as Prometheus metrics on :9200/metrics.
  cdc-monitor:
    image: python:3.11-slim
    container_name: kiva_cdc_monitor
    command: >
      sh -c "pip install --no-cache-dir -r requirements-cdc-monitor.txt &&
      python cdc_monitor.py"
    working_dir: /app
    volumes:
      - ./src:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kiva_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-kiva_password}
      DB_NAME: ${POSTGRES_DB:-kiva_oltp}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kiva_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kiva_password}
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: kiva-postgres-connector
      POLL_INTERVAL_SECONDS: "15"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # --- prometheus: Time-series metrics engine scraping telemetry from all pipeline layers ---
  prometheus:
    image: prom/prometheus:latest
    container_name: kiva_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  # --- mailpit: Local SMTP server and inbox catching Grafana alert notification emails ---
  # Grafana doesn’t send email directly—it only acts as an SMTP client and requires an SMTP relay to deliver messages.  
  # For local dev, Mailpit provides that relay by accepting unauthenticated SMTP on `:1025` and exposing captured emails 
  # via `:8025`, so you can validate the full alert-to-email pipeline end-to-end.
  mailpit:
    image: axllent/mailpit:latest
    container_name: kiva_mailpit
    ports:
      - "8025:8025" # Web UI: view captured emails
      - "1025:1025" # SMTP submission port Grafana connects to
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # --- grafana-plugin-installer: One-shot init job provisioning ClickHouse datasource plugin for Grafana ---
  # Grafana >= 11.5’s plugin installer (whether driven by GF_INSTALL_PLUGINS or GF_PLUGINS_PREINSTALL) merges 
  # whatever you request into Grafana’s built-in default app-plugin list. There is no supported env var to 
  # install only the requested plugin without also pulling in Grafana defaults.
  # Therefore, we use a separate one-off "installer" container to install vertamedia-clickhouse-datasource directly 
  # with `grafana cli plugins install`into the shared grafana_data volume, bypassing the merge logic entirely.
  grafana-plugin-installer:
    image: grafana/grafana-oss:latest
    container_name: kiva_grafana_plugin_installer
    entrypoint: ["grafana"]
    command: ["cli", "--pluginsDir", "/var/lib/grafana/plugins", "plugins", "install", "vertamedia-clickhouse-datasource"]
    volumes:
      - grafana_data:/var/lib/grafana
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  # --- grafana: Unified monitoring dashboard visualizing pipeline health, CDC sync, and alerts ---
  grafana:
    image: grafana/grafana-oss:latest
    container_name: kiva_grafana
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflicting with Dagster
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-kiva}
      # The ClickHouse plugin is preinstalled by grafana-plugin-installer above. This disables Grafana's own 
      # default-app-plugin auto-install this project only uses Prometheus + ClickHouse, so those defaults are 
      # pure memory/disk overhead, each running as its own backend subprocess.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      # Avoid background HTTP calls to grafana.com for update checks -- not
      # useful for a local/offline demo stack, and one less thing running.
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # SMTP relay for alert notification emails -- see the mailpit service above. No auth needed: Mailpit accepts any local submission.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailpit:1025
      - GF_SMTP_FROM_ADDRESS=alerts@kiva.local
      - GF_SMTP_FROM_NAME=Kiva Microfinance Data Platform
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      grafana-plugin-installer:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    deploy:
      resources:
        limits: 
          # Unified alerting + bleve index building increased Grafana’s memory baseline; 256M was OOM-killed 
          # (exit 137) ~10–15 min after startup.Even with the minimal plugin setup, usage climbed to ~80% of 
          # 512M quickly, so we set Grafana’s limit to 768M for stable headroom.
          memory: 768M

  # ====================================================
  # TIER 6: MANAGEMENT & DEVELOPER INSPECTION CONSOLES
  # ====================================================

  # --- redpanda-console: Web UI for inspecting Redpanda topics, consumer groups, and streaming records ---
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: kiva_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # --- debezium-ui: Web console for viewing Debezium CDC connector configurations and status ---
  debezium-ui:
    image: quay.io/debezium/debezium-ui:2.5
    container_name: kiva_debezium_ui
    ports:
      - "8084:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    depends_on:
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pg_data:
  ch_data:
  redpanda_data:
  grafana_data:
